services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sicog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ctrl_operacional_gas
    ports:
      - "5432:5432"
    volumes:
      - sicog_postgres_data:/var/lib/postgresql/data

volumes:
  sicog_postgres_data:
